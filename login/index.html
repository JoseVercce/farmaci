<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso al Sistema - Los Berti</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../frontend/assets/css/favicon.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-wrapper fade-in">
  <div class="login-card slide-up">
    <div class="logo-area">
      <img src="logo_login.png" alt="Farmacia" class="logo">
      <p class="subtitle">Sistema Gestor de Inventario</p>
    </div>

    <form id="form-login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="login-usuario" name="usuario" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" name="clave" required>
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>
    <p class="footer-text">© 2026 Farmacia Los Berti — Gestor de Inventario</p>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
