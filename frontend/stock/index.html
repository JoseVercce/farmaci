<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Stock</title>
  <link rel="icon" type="image/x-icon" href="../assets/css/favicon.png">
  <link rel="stylesheet" href="../assets/css/styles.css?v=filtro-desplegable">
</head>
<body>
<div class="layout">
<script src="../assets/js/menu.js"></script>

<main class="main">
  <section class="section visible">
    <div class="section-header">
      <h2>📊 Gestión de stock</h2>
      <div class="search-controls">
        <input type="text" id="buscar-stock" placeholder="Buscar producto o estado...">
      </div>
      <div id="filtro-stock" class="filtro-estado">
        <button type="button" data-filtro-toggle aria-haspopup="true" aria-expanded="false">Filtrar estado ▾</button>
        <div data-filtro-menu class="hidden" role="group" aria-label="Filtrar registros de stock por estado">
          <button type="button" data-estado="1">Activos</button>
          <button type="button" data-estado="0">Inactivos</button>
          <button type="button" data-estado="todos">Todos</button>
        </div>
      </div>
    </div>

    <table class="table">
      <thead>
        <tr>
        <th>Producto</th>
        <th>Cantidad actual</th>
        <th>Mínima</th>
        <th>Máxima</th>
        <th>Condición</th>
        <th>Estado registro</th>
        <th>Almacén</th>
        </tr>
      
      </thead>
      <tbody id="tabla-stock"></tbody>
    </table>
    <div id="paginacion-stock" class="pagination"></div>
  </section>
</main>
</div>


<div id="modal-transferencia" class="modal hidden">
  <div class="modal-content transferencia-modal">

    <h2 class="modal-title">Mover producto</h2>

    <div class="transfer-info">
      <div class="info-item">
        <span class="label">Producto:</span>
        <span id="trans-producto" class="value"></span>
      </div>

      <div class="info-item">
        <span class="label">Almacén origen:</span>
        <span id="trans-origen" class="value"></span>
      </div>

      <div class="info-item">
        <span class="label">Disponible:</span>
        <span id="trans-disponible" class="value"></span>
      </div>
    </div>

    <h3 class="section-title">Datos de transferencia</h3>

    <label class="label">Almacén destino:</label>
    <select id="trans-destino" class="input-select"></select>

    <label class="label">Cantidad a transferir:</label>
    <input type="number" id="trans-cantidad" class="input-number">

    <button class="btn-secondary cerrar-modal-btn" onclick="confirmarTransferencia()">Mover</button>
    <button class="btn-secondary cerrar-modal-btn" onclick="cerrarTransferencia()">Cancelar</button>

  </div>
</div>



<div id="modal-ajustes" class="modal hidden">
  <div class="modal-ajustes-content">
    <h2 class="aj-title">Ajustes de la Farmacia</h2>
    <div class="aj-grid">
      <div class="aj-block">
        <h3 class="aj-subtitle">Identidad</h3>
        <label>Nombre comercial</label>
        <input type="text" id="aj-nombre">

        <label>Logo</label>
        <div class="file-center">
          <div class="file-input-wrapper">
            <input type="file" id="aj-logo" accept="image/*">
            <label for="aj-logo" class="file-btn">Elegir archivo</label>
            <span id="file-name">No se ha seleccionado ningún archivo</span>
          </div>
          <img id="aj-preview-logo" class="preview-logo" src="">
        </div>
      </div>

      <div class="aj-block">
        <h3 class="aj-subtitle">Colores del Sistema</h3>
        <label>Color primario</label>
        <input type="color" id="aj-color-primario">

        <label>Color secundario</label>
        <input type="color" id="aj-color-secundario">

        <label>Color del sidebar</label>
        <input type="color" id="aj-color-sidebar">
      </div>
    </div>

    <div class="aj-actions">
      <button id="aj-guardar" class="save-btn">Guardar cambios</button>
      <button id="aj-cerrar" class="close-btn">Cerrar</button>
    </div>
  </div>
</div>


<script src="../assets/js/feedback.js"></script>
<script src="../assets/js/filtro_estado.js"></script>
<script src="stock.js"></script>
<script src="../assets/js/usuario.js"></script>
<script src="../assets/js/config_farmacia.js"></script>
<script src="../assets/js/ajustes_sidebar.js"></script>
<script src="../assets/js/permisos.js"></script>
<script>
document.querySelectorAll(".nav-dropdown-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const parent = btn.parentElement;
    parent.classList.toggle("open");});
});
</script>
</body>
</html>
