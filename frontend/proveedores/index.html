<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proveedores</title>
  <link rel="icon" type="image/x-icon" href="../assets/css/favicon.png">
  <link rel="stylesheet" href="../assets/css/styles.css?v=filtro-desplegable">
</head>
<body>
<div class="layout">
<script src="../assets/js/menu.js"></script>

<main class="main">
  <section class="section visible">
    <div class="section-header">
      <h2>🤝 Proveedores</h2>

      <div class="search-controls">
        <input type="text" id="buscar-proveedor" placeholder="Buscar proveedor...">
      </div>
      <div id="filtro-proveedores" class="filtro-estado">
        <button type="button" data-filtro-toggle aria-haspopup="true" aria-expanded="false">Filtrar estado ▾</button>
        <div data-filtro-menu class="hidden" role="group" aria-label="Filtrar proveedores por estado">
          <button type="button" data-estado="1">Activos</button>
          <button type="button" data-estado="0">Inactivos</button>
          <button type="button" data-estado="todos">Todos</button>
        </div>
      </div>
      <button id="btn-nuevo-proveedor" class="btn-primary btn-crear">Nuevo proveedor</button>
    </div>

    <table class="table">
      <thead>
        <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Dirección</th>
        <th>Estado</th>
        <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-proveedores"></tbody>
    </table>
    <div id="paginacion-proveedores" class="pagination"></div>
  </section>
</main>
</div>

<div id="modal-proveedor" class="modal hidden">
  <div class="modal-content">
    <h2 id="modal-prov-title">Nuevo proveedor</h2>

    <form id="form-proveedor">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="prov-nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="prov-telefono" name="telefono">
      </div>

      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="prov-correo" name="correo">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="prov-direccion" name="direccion">
      </div>

      <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar</button>
        <button type="button" class="btn-secondary" id="btn-cancelar-prov">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-ajustes" class="modal hidden">
  <div class="modal-ajustes-content">
    <h2 class="aj-title">Ajustes de la Farmacia</h2>
    <div class="aj-grid">
      <div class="aj-block">
        <h3 class="aj-subtitle">Identidad</h3>
        <label>Nombre comercial</label>
        <input type="text" id="aj-nombre">

        <label>Logo</label>
        <div class="file-center">
          <div class="file-input-wrapper">
            <input type="file" id="aj-logo" accept="image/*">
            <label for="aj-logo" class="file-btn">Elegir archivo</label>
            <span id="file-name">No se ha seleccionado ningún archivo</span>
          </div>
          <img id="aj-preview-logo" class="preview-logo" src="">
        </div>
      </div>

      <div class="aj-block">
        <h3 class="aj-subtitle">Colores del Sistema</h3>
        <label>Color primario</label>
        <input type="color" id="aj-color-primario">

        <label>Color secundario</label>
        <input type="color" id="aj-color-secundario">

        <label>Color del sidebar</label>
        <input type="color" id="aj-color-sidebar">
      </div>
    </div>

    <div class="aj-actions">
      <button id="aj-guardar" class="save-btn">Guardar cambios</button>
      <button id="aj-cerrar" class="close-btn">Cerrar</button>
    </div>
  </div>
</div>



<script>
document.querySelectorAll(".nav-dropdown-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const parent = btn.parentElement;
    parent.classList.toggle("open");});
});
</script>
<script src="../assets/js/feedback.js"></script>
<script src="../assets/js/filtro_estado.js?v=1"></script>
<script src="proveedores.js"></script>
<script src="../assets/js/usuario.js"></script>
<script src="../assets/js/config_farmacia.js"></script>
<script src="../assets/js/ajustes_sidebar.js"></script>
<script src="../assets/js/permisos.js"></script>
</body>
</html>
