<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../assets/css/favicon.png">
  <link rel="stylesheet" href="../assets/css/styles.css?v=filtro-desplegable">
</head>
<body>
<div class="layout">
<script src="../assets/js/menu.js"></script>
<main class="main">
  <section class="section visible">
    <div class="section-header">
      <h2>🧴 Gestión de productos</h2>
        <div class="search-controls">
        <input type="text" id="buscar-producto" placeholder="Buscar producto...">
      </div>
        <div id="filtro-productos" class="filtro-estado">
          <button type="button" data-filtro-toggle aria-haspopup="true" aria-expanded="false">Filtrar estado ▾</button>
          <div data-filtro-menu class="hidden" role="group" aria-label="Filtrar productos por estado">
            <button type="button" data-estado="1">Activos</button>
            <button type="button" data-estado="0">Inactivos</button>
            <button type="button" data-estado="todos">Todos</button>
          </div>
        </div>
      <button id="btn-nuevo-producto" class="btn-primary btn-crear">Nuevo producto</button>
    </div>

    <table class="table">
      <thead>
        <tr>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Categoría</th>
        <th>Precio venta</th>
        <th>Estado</th>
        <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>

    <div id="paginacion-productos" class="pagination"></div>
  </section>
</main>
</div>

<div id="modal-producto" class="modal">
  <div class="modal-content">
    <h2 id="modal-title">Nuevo producto</h2>
    <form id="form-producto">
    <input type="hidden" id="prod-id" name="id">

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="prod-nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label>Categoría</label>
      <select id="prod-categoria" name="id_categoria" required></select>
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <input type="text" id="prod-descripcion" name="descripcion">
    </div>

    <div class="form-group">
      <label>Precio</label>
      <input type="number" id="prod-precio" name="precio" step="0.01" required>
    </div>

    <div class="form-group">
      <label>Cantidad mínima</label>
      <input type="number" id="prod-min" name="cantidad_minima" min="0" required>
    </div>

    <div class="form-group">
        <label>Cantidad máxima</label>
        <input type="number" id="prod-max" name="cantidad_maxima" min="1" required>
    </div>

    <div class="form-group">
      <button type="submit" class="btn-primary">Guardar</button>
      <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
    </div>
  </div>
  </form>
</div>

<div id="modal-ajustes" class="modal hidden">
  <div class="modal-ajustes-content">
    <h2 class="aj-title">Ajustes de la Farmacia</h2>
    <div class="aj-grid">
      <div class="aj-block">
        <h3 class="aj-subtitle">Identidad</h3>
        <label>Nombre comercial</label>
        <input type="text" id="aj-nombre">

        <label>Logo</label>
        <div class="file-center">
          <div class="file-input-wrapper">
            <input type="file" id="aj-logo" accept="image/*">
            <label for="aj-logo" class="file-btn">Elegir archivo</label>
            <span id="file-name">No se ha seleccionado ningún archivo</span>
          </div>
          <img id="aj-preview-logo" class="preview-logo" src="">
        </div>
      </div>

      <div class="aj-block">
        <h3 class="aj-subtitle">Colores del Sistema</h3>
        <label>Color primario</label>
        <input type="color" id="aj-color-primario">

        <label>Color secundario</label>
        <input type="color" id="aj-color-secundario">

        <label>Color del sidebar</label>
        <input type="color" id="aj-color-sidebar">
      </div>
    </div>

    <div class="aj-actions">
      <button id="aj-guardar" class="save-btn">Guardar cambios</button>
      <button id="aj-cerrar" class="close-btn">Cerrar</button>
    </div>
  </div>
</div>


<div id="modal-mensaje" class="modal hidden">
  <div class="modal-content" style="max-width: 400px; text-align: center; padding: 30px;">

      <div id="mensaje-icono" style="font-size: 50px; margin-bottom: 15px;">✔️</div>

      <h3 id="mensaje-texto" style="font-size: 20px; margin-bottom: 20px; color: #374151;">
        Mensaje aquí
      </h3>

      <button id="mensaje-btn" class="btn-primary" style="width: 100%; padding: 12px;">
        Aceptar
      </button>
  </div>
</div>

<!-- MODAL DE CONFIRMACIÓN -->
<div id="modal-confirmar" class="modal hidden">
  <div class="modal-content" style="max-width: 420px; text-align: center; padding: 30px;">

      <div style="font-size: 55px; margin-bottom: 15px; color: #e11d48;">⚠️</div>

      <h3 id="confirmar-texto" style="font-size: 20px; margin-bottom: 25px; color: #374151;">
        ¿Está seguro?
      </h3>

      <div style="display: flex; gap: 12px; justify-content: center;">
          <button id="confirmar-aceptar" class="btn-primary" style="padding: 10px 20px;">
            Sí, eliminar
          </button>

          <button id="confirmar-cancelar" class="btn-secondary" style="padding: 10px 20px;">
            Cancelar
          </button>
      </div>

  </div>
</div>

<script>
document.querySelectorAll(".nav-dropdown-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.parentElement.classList.toggle("open");
  });
});
</script>
<script src="../assets/js/filtro_estado.js"></script>
<script src="productos.js"></script>
<script src="../assets/js/usuario.js"></script>
<script src="../assets/js/config_farmacia.js"></script>
<script src="../assets/js/ajustes_sidebar.js"></script>
<script src="../assets/js/permisos.js"></script>

</body>
</html>
